name: Apply visual system v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'design/visual-refresh-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/visual-refresh-v1
          fetch-depth: 0

      - name: Apply visual system integration
        run: |
          if ! grep -q "visual-system-v3.css" index.html; then
            python scripts/apply-visual-system-v3.py
          else
            echo "Visual system already integrated"
          fi

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js package.json .github/workflows/validate-interface.yml
          if git diff --cached --quiet; then
            echo "No integration changes"
            exit 0
          fi
          git commit -m "feat: integrar sistema visual premium global"
          git push origin HEAD:design/visual-refresh-v1
