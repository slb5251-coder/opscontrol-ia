name: Extract auth session module

on:
  pull_request:
    branches: [homologacao]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'refactor/extract-auth-session-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-auth-session-v1
          fetch-depth: 0

      - name: Extract authentication and session
        run: |
          if grep -q "async function initClient" js/app.js; then
            python scripts/extract-auth-session.py
          else
            echo "Authentication already extracted"
          fi

      - name: Commit extracted authentication module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html sw.js package.json
          if git diff --cached --quiet; then
            echo "No extraction changes"
            exit 0
          fi
          git commit -m "refactor: extrair autenticação e sessão"
          git push origin HEAD:refactor/extract-auth-session-v1
