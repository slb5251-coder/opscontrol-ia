name: Patch alert contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'homologacao'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao
          fetch-depth: 0
      - name: Align frontend with production alert contract
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Trecho não localizado: {label}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('js/alert-center-v2.js',
            'const VERSION = "20260723-alert-center-v2-2";',
            'const VERSION = "20260723-alert-center-v2-3";',
            'versão da central')
          replace('js/alert-center-v2.js',
            'client.from("alerts").select("id,title,message,level,target_group,target_user_id,is_read,created_by,created_at,workflow_status,assigned_to,due_at,acknowledged_at,acknowledged_by,resolved_at,resolved_by,resolution_notes").order("created_at", { ascending: false }).limit(200)',
            'client.from("alerts").select("id,title,message,level,target_group,target_user_id,is_read,created_by,created_at,status,responsible_user_id,due_at,acknowledged_at,acknowledged_by,resolved_at,resolved_by,updated_at").order("created_at", { ascending: false }).limit(200)',
            'consulta de alertas')
          replace('js/alert-center-v2.js',
            '''alerts = (alertsResult.data || []).map(item => ({
              ...item,
              status: item.workflow_status || "Novo",
              responsible_user_id: item.assigned_to || null
            }));''',
            'alerts = alertsResult.data || [];',
            'normalização de alertas')
          replace('js/alert-center-v2.js',
            'p_assigned_to: responsible || null,',
            'p_responsible_user_id: responsible || null,',
            'parâmetro de responsável')
          replace('js/alert-center-v2.js',
            '<div><label>Responsável</label><select name="assigned_to">${profileOptions("", true)}</select></div>',
            '<div><label>Responsável</label><select name="responsible_user_id">${profileOptions("", true)}</select></div>',
            'campo responsável')
          replace('js/alert-center-v2.js',
            '''workflow_status: data.workflow_status || "Novo",
              assigned_to: data.assigned_to || null,''',
            '''status: data.workflow_status || "Novo",
              responsible_user_id: data.responsible_user_id || null,''',
            'inserção de alerta')
          replace('js/interface-runtime.js',
            'script: "alert-center-v2.js?v=20260723-alert-center-v2-2",\n      styles: ["../alert-center-v2.css?v=20260723-alert-center-v2-2"]',
            'script: "alert-center-v2.js?v=20260723-alert-center-v2-3",\n      styles: ["../alert-center-v2.css?v=20260723-alert-center-v2-3"]',
            'cache da central')
          replace('supabase/migrations/20260722230000_observability_health_v1.sql',
            "where workflow_status<>'Resolvido' and due_at is not null and due_at<now();",
            "where status<>'Resolvido' and due_at is not null and due_at<now();",
            'saúde dos alertas')
      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/alert-center-v2.js js/interface-runtime.js supabase/migrations/20260722230000_observability_health_v1.sql
          git commit -m "fix: alinhar frontend ao contrato de alertas da produção"
          git push origin HEAD:homologacao
