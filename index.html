<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a35">
  <title>OpsControl IA V2</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <section id="loginView" class="login-view">
    <div class="login-hero">
      <span class="hero-badge">B-PORT LMP</span>
      <h1>OpsControl IA</h1>
      <p>Controle integrado de operações, tanques, fluidos, carretas, QHSE, manutenção e documentos.</p>
    </div>
    <div class="login-panel">
      <div class="login-card">
        <div class="logo-mark">OC</div>
        <h2>Entrar no sistema</h2>
        <p id="connectionHint">Use seu usuário do Supabase ou abra a demonstração.</p>
        <label>E-mail</label>
        <input id="loginEmail" type="email" placeholder="nome@empresa.com">
        <label>Senha</label>
        <input id="loginPassword" type="password" placeholder="Sua senha">
        <button id="loginBtn" class="btn primary full">Entrar</button>
        <button id="demoBtn" class="btn soft full">Visualizar demonstração</button>
        <button id="setupBtnLogin" class="text-button">Configurar conexão Supabase</button>
        <div id="loginMessage" class="message hidden"></div>
      </div>
    </div>
  </section>

  <section id="appView" class="app-view hidden">
    <header class="topbar">
      <div class="topbar-left">
        <button id="menuBtn" class="icon-btn mobile-only">☰</button>
        <div class="brand"><span class="brand-mark">OC</span><div><strong>OpsControl IA</strong><small>V2</small></div></div>
      </div>
      <div class="topbar-right">
        <span id="syncBadge" class="status-badge neutral">Modo local</span>
        <button id="notificationsBtn" class="icon-btn">🔔<span id="alertCount" class="count-badge">0</span></button>
        <button class="user-chip"><span id="userInitials">JV</span><div><strong id="userName">Demonstração</strong><small id="userRole">Administrador</small></div></button>
      </div>
    </header>

    <div class="shell">
      <aside id="sidebar" class="sidebar">
        <nav>
          <button class="nav-item active" data-page="dashboard">⌂ Dashboard</button>
          <button class="nav-item" data-page="operations">⚓ Operações</button>
          <button class="nav-item" data-page="tanks">◉ Tanques e Silos</button>
          <button class="nav-item" data-page="fluids">◆ Fluidos e Granéis</button>
          <button class="nav-item" data-page="trucks">▣ Carretas</button>
          <button class="nav-item" data-page="qhse">✓ QHSE</button>
          <button class="nav-item" data-page="maintenance">⚙ Manutenção</button>
          <button class="nav-item" data-page="certificates">▤ Certificados</button>
          <button class="nav-item" data-page="alerts">! Alertas e Chat</button>
          <button class="nav-item" data-page="reports">▥ Relatórios</button>
          <button class="nav-item" data-page="settings">⚒ Configurações</button>
        </nav>
        <div class="sidebar-footer">
          <div class="plant-card"><small>Unidade</small><strong>B-Port LMP</strong><span>Porto do Açu</span></div>
          <button id="logoutBtn" class="btn danger outline full">Sair</button>
        </div>
      </aside>

      <main class="main-content">
        <section id="page-dashboard" class="page active"></section>
        <section id="page-operations" class="page"></section>
        <section id="page-tanks" class="page"></section>
        <section id="page-fluids" class="page"></section>
        <section id="page-trucks" class="page"></section>
        <section id="page-qhse" class="page"></section>
        <section id="page-maintenance" class="page"></section>
        <section id="page-certificates" class="page"></section>
        <section id="page-alerts" class="page"></section>
        <section id="page-reports" class="page"></section>
        <section id="page-settings" class="page"></section>
      </main>
    </div>
  </section>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div><small id="modalEyebrow">REGISTRO</small><h2 id="modalTitle">Novo registro</h2></div>
        <button id="modalClose" class="icon-btn">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
