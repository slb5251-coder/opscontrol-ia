name: Diagnose alert flow

on:
  pull_request:
    branches: [homologacao]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'release/staging-e2e-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/staging-e2e-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose-alert-flow.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ALERT_FLOW_DIAG.md
          git commit -m "chore: registrar diagnóstico temporário de alerta"
          git push origin HEAD:release/staging-e2e-v1
