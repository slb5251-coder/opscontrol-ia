name: Export Staging Migrations

on:
  push:
    branches: [homologacao]
    paths:
      - '.github/workflows/export-staging-migrations.yml'
      - 'supabase/migrations/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-staging-migrations.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select migrations for restored release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-migrations
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                name="$(basename "$file")"
                version="${name%%_*}"
                if [[ "$version" -le "20260722150757" ]]; then
                  cp "$file" staging-migrations/
                fi
              done
          count="$(find staging-migrations -type f -name '*.sql' | wc -l)"
          test "$count" -gt 0
          echo "Exported $count migrations."

      - name: Upload staging migrations
        uses: actions/upload-artifact@v4
        with:
          name: staging-migrations-${{ github.run_number }}
          path: staging-migrations/
          if-no-files-found: error
          retention-days: 7
