name: Patch alert contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'homologacao'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao
          fetch-depth: 0
      - name: Align frontend with production alert contract
        shell: python
        run: |
          import re
          from pathlib import Path

          alert_path = Path('js/alert-center-v2.js')
          alert = alert_path.read_text(encoding='utf-8')
          alert = alert.replace('const VERSION = "20260723-alert-center-v2-2";', 'const VERSION = "20260723-alert-center-v2-3";')
          alert = alert.replace(
            'client.from("alerts").select("id,title,message,level,target_group,target_user_id,is_read,created_by,created_at,workflow_status,assigned_to,due_at,acknowledged_at,acknowledged_by,resolved_at,resolved_by,resolution_notes").order("created_at", { ascending: false }).limit(200)',
            'client.from("alerts").select("id,title,message,level,target_group,target_user_id,is_read,created_by,created_at,status,responsible_user_id,due_at,acknowledged_at,acknowledged_by,resolved_at,resolved_by,updated_at").order("created_at", { ascending: false }).limit(200)'
          )
          alert = re.sub(
            r'alerts = \(alertsResult\.data \|\| \[\]\)\.map\(item => \(\{\s*\.\.\.item,\s*status: item\.workflow_status \|\| "Novo",\s*responsible_user_id: item\.assigned_to \|\| null\s*\}\)\);',
            'alerts = alertsResult.data || [];',
            alert,
            count=1,
            flags=re.S
          )
          alert = alert.replace('p_assigned_to: responsible || null,', 'p_responsible_user_id: responsible || null,')
          alert = alert.replace('name="assigned_to"', 'name="responsible_user_id"')
          alert = alert.replace('workflow_status: data.workflow_status || "Novo",', 'status: data.workflow_status || "Novo",')
          alert = alert.replace('assigned_to: data.assigned_to || null,', 'responsible_user_id: data.responsible_user_id || null,')
          required = [
            'const VERSION = "20260723-alert-center-v2-3";',
            'created_at,status,responsible_user_id,due_at',
            'alerts = alertsResult.data || [];',
            'p_responsible_user_id: responsible || null,',
            'name="responsible_user_id"',
            'status: data.workflow_status || "Novo",',
            'responsible_user_id: data.responsible_user_id || null,'
          ]
          missing = [item for item in required if item not in alert]
          if missing:
            raise SystemExit(f'Alinhamento incompleto no alert-center-v2.js: {missing}')
          alert_path.write_text(alert, encoding='utf-8')

          runtime_path = Path('js/interface-runtime.js')
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime = runtime.replace('20260723-alert-center-v2-2', '20260723-alert-center-v2-3')
          if '20260723-alert-center-v2-3' not in runtime:
            raise SystemExit('Versão da Central de Alertas não atualizada no loader.')
          runtime_path.write_text(runtime, encoding='utf-8')

          migration_path = Path('supabase/migrations/20260722230000_observability_health_v1.sql')
          migration = migration_path.read_text(encoding='utf-8')
          migration = migration.replace("where workflow_status<>'Resolvido' and due_at is not null and due_at<now();", "where status<>'Resolvido' and due_at is not null and due_at<now();")
          if "where status<>'Resolvido' and due_at is not null and due_at<now();" not in migration:
            raise SystemExit('Consulta de saúde dos alertas não foi alinhada.')
          migration_path.write_text(migration, encoding='utf-8')
      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/alert-center-v2.js js/interface-runtime.js supabase/migrations/20260722230000_observability_health_v1.sql
          git commit -m "fix: alinhar frontend ao contrato de alertas da produção"
          git push origin HEAD:homologacao
