name: Patch E2E navigation

on:
  pull_request:
    branches: [homologacao]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'release/staging-e2e-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/staging-e2e-v1
          fetch-depth: 0
      - name: Ensure modal is closed before page navigation
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/staging-e2e.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''async function openPage(page, name) {
            const button = page.locator(`.nav-item[data-page="${name}"]`).first();
          '''
          new = '''async function openPage(page, name) {
            if (await page.locator('#modal').isVisible()) await closeModal(page);
            const button = page.locator(`.nav-item[data-page="${name}"]`).first();
          '''
          if old not in text:
            raise SystemExit('Trecho esperado não localizado')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/staging-e2e.spec.mjs
          git commit -m "test: fechar modal antes da navegação E2E"
          git push origin HEAD:release/staging-e2e-v1
