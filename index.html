<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpsControl IA</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 520px;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #2563eb;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>OpsControl IA</h1>
    <p>Site operacional em desenvolvimento.</p>
    <p>Controle de tanques, fluidos, certificados, QHSE, operações e histórico operacional.</p>
    <div class="badge">Versão inicial no GitHub Pages</div>
  </div>
</body>
</html>
