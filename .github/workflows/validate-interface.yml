name: Validate OPSControl

on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main, homologacao]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate static files
        run: npm run lint

      - name: Validate JavaScript
        run: npm run typecheck

      - name: Run responsive tests
        run: npm run test:responsive

      - name: Run environment isolation tests
        run: npm run test:environment

      - name: Run observability tests
        run: npm run test:observability

      - name: Run module loader tests
        run: npm run test:performance-loader

      - name: Run database hardening tests
        run: npm run test:database-hardening

      - name: Run security tests
        run: node tests/security.spec.mjs

      - name: Build application
        run: npm run build

      - name: Validate runtime references and CSS balance
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          errors = []
          runtime_css = Path('interface-runtime.css').read_text(encoding='utf-8')
          runtime_js = Path('js/interface-runtime.js').read_text(encoding='utf-8')
          service_worker = Path('sw.js').read_text(encoding='utf-8')
          config_js = Path('js/config.js').read_text(encoding='utf-8')

          css_refs = re.findall(r"@import\s+url\(['\"]?([^'\")?]+)", runtime_css)
          dynamic_css_refs = re.findall(r'"(\.\./[^\"]+\.css\?v=[^\"]+)"', runtime_js)
          js_refs = re.findall(r'"([A-Za-z0-9._/-]+\.js\?v=[^"]+)"', runtime_js)

          for ref in css_refs:
            path = Path(ref.split('?')[0].lstrip('./'))
            if not path.exists():
              errors.append(f'Missing CSS reference: {path}')

          for ref in dynamic_css_refs:
            path = Path(ref.split('?')[0].removeprefix('../'))
            if not path.exists():
              errors.append(f'Missing lazy CSS reference: {path}')

          for ref in js_refs:
            path = Path('js') / Path(ref.split('?')[0]).name
            if not path.exists():
              errors.append(f'Missing JS reference: {path}')

          required = [
            Path('final-interface.css'),
            Path('interface-fix.css'),
            Path('homologation.css'),
            Path('system-health.css'),
            Path('js/ui-polish.js'),
            Path('js/interface-runtime.js'),
            Path('js/system-observability.js'),
            Path('tests/environment.spec.mjs'),
            Path('tests/observability.spec.mjs'),
            Path('tests/performance-loader.spec.mjs'),
            Path('tests/database-hardening.spec.mjs'),
            Path('supabase/migrations/20260722230000_observability_health_v1.sql'),
            Path('supabase/migrations/20260722231500_observability_hardening_v1.sql'),
            Path('supabase/migrations/20260723001500_revoke_anon_and_public_policies.sql'),
            Path('supabase/migrations/20260723001600_consolidate_rls_policies.sql'),
            Path('supabase/migrations/20260723001700_cover_foreign_keys_and_remove_duplicates.sql'),
          ]
          for path in required:
            if not path.exists():
              errors.append(f'Missing required interface file: {path}')

          for token in ['production', 'staging', 'opscontrol_environment']:
            if token not in config_js:
              errors.append(f'Missing environment guard token in config: {token}')

          for token in ['CORE_FILES', 'cacheFirst', 'networkFirst']:
            if token not in service_worker:
              errors.append(f'Missing modular cache token in service worker: {token}')

          forbidden = [
            'design-upgrade.css',
            'js/design-upgrade.js',
            'js/design-stability.js',
          ]
          combined = runtime_css + runtime_js + service_worker
          for item in forbidden:
            if item in combined:
              errors.append(f'Legacy reference still active: {item}')

          for path in Path('.').glob('*.css'):
            text = path.read_text(encoding='utf-8')
            if text.count('{') != text.count('}'):
              errors.append(f'Unbalanced CSS braces: {path}')

          if errors:
            print('\n'.join(f'- {error}' for error in errors))
            sys.exit(1)

          print(f'Validated {len(css_refs)} core CSS imports, {len(dynamic_css_refs)} lazy CSS assets, {len(js_refs)} JS modules, observability, performance, RLS and environment isolation files.')

      - name: Upload responsive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-test-results-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14