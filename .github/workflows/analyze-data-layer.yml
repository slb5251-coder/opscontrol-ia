name: Analyze data layer

on:
  pull_request:
    branches: [homologacao]

permissions:
  contents: write

jobs:
  analyze:
    if: github.head_ref == 'refactor/extract-data-layer-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-data-layer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save acorn@8
      - run: node scripts/analyze-data-layer.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DATA_LAYER_REPORT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: mapear camada de dados"
          git push origin HEAD:refactor/extract-data-layer-v1
