name: Patch alert center v2

on:
  pull_request:
    branches: [homologacao]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'release/staging-e2e-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/staging-e2e-v1
          fetch-depth: 0
      - name: Align alert center with current schema
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Trecho não localizado: {label}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('js/alert-center-v2.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
            ('const VERSION = "20260722-alert-center-v2-1";', 'const VERSION = "20260723-alert-center-v2-2";', 'versão'),
            ('let activeChannel = localStorage.getItem(CHANNEL_KEY) || "operacao-geral";', 'let activeChannel = localStorage.getItem(CHANNEL_KEY) || "geral";', 'canal padrão'),
            ('{ id: "operacao-geral", label: "Geral", roles: ["*"] }', '{ id: "geral", label: "Geral", roles: ["*"] }', 'definição do canal geral'),
            ('if (!channels.some(channel => channel.id === activeChannel)) activeChannel = channels[0]?.id || "operacao-geral";', 'if (activeChannel === "operacao-geral") activeChannel = "geral";\n    if (!channels.some(channel => channel.id === activeChannel)) activeChannel = channels[0]?.id || "geral";', 'normalização do canal'),
            ('const config = window.OPSCONTROL_CONFIG || {};\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem(CONFIG_KEY) || "{}"); } catch {}\n    const environment = localStorage.getItem(ENV_KEY) || config.defaultEnvironment || "production";\n    const selected = config.environments?.[environment] || {};\n    return {\n      url: saved.url || selected.supabaseUrl || config.supabaseUrl || "",\n      key: saved.key || selected.supabaseKey || config.supabaseKey || ""\n    };', 'const config = window.OPSCONTROL_CONFIG || {};\n    const modular = window.OpsControlAuth?.loadConfig?.(config);\n    if (modular?.url && modular?.key) return modular;\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem(CONFIG_KEY) || "{}"); } catch {}\n    const environment = localStorage.getItem(ENV_KEY) || config.defaultEnvironment || "production";\n    const selected = config.environments?.[environment] || {};\n    const named = Boolean(selected.supabaseUrl && selected.supabaseKey);\n    return {\n      url: named ? selected.supabaseUrl : (saved.url || config.supabaseUrl || ""),\n      key: named ? selected.supabaseKey : (saved.key || config.supabaseKey || ""),\n      environment\n    };', 'configuração modular'),
            ('const { url, key } = appConfig();', 'const { url, key, environment = "production" } = appConfig();', 'ambiente do cliente'),
            ('storageKey: remember ? "opscontrol-auth" : "opscontrol-auth-session"', 'storageKey: remember\n          ? `opscontrol-auth${environment !== "production" ? `-${environment}` : ""}`\n          : `opscontrol-auth-session${environment !== "production" ? `-${environment}` : ""}`', 'isolamento da sessão'),
            ('client.from("alerts").select("id,title,message,level,target_group,target_user_id,is_read,created_by,created_at,status,responsible_user_id,due_at,acknowledged_at,acknowledged_by,resolved_at,resolved_by,updated_at").order("created_at", { ascending: false }).limit(200)', 'client.from("alerts").select("id,title,message,level,target_group,target_user_id,is_read,created_by,created_at,workflow_status,assigned_to,due_at,acknowledged_at,acknowledged_by,resolved_at,resolved_by,resolution_notes").order("created_at", { ascending: false }).limit(200)', 'consulta de alertas'),
            ('alerts = alertsResult.data || [];', 'alerts = (alertsResult.data || []).map(item => ({\n      ...item,\n      status: item.workflow_status || "Novo",\n      responsible_user_id: item.assigned_to || null\n    }));', 'normalização de alertas'),
            ('p_responsible_user_id: responsible || null,', 'p_assigned_to: responsible || null,', 'parâmetro do responsável'),
            ('<div><label>Responsável</label><select name="responsible_user_id">${profileOptions("", true)}</select></div>', '<div><label>Responsável</label><select name="assigned_to">${profileOptions("", true)}</select></div>', 'campo responsável'),
            ('status: data.workflow_status || "Novo",\n      responsible_user_id: data.responsible_user_id || null,', 'workflow_status: data.workflow_status || "Novo",\n      assigned_to: data.assigned_to || null,', 'colunas de inserção')
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'Trecho não localizado em alert-center-v2.js: {label}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          replace('js/app.js', 'channel: "operacao-geral", sender_id: state.user.id,', 'channel: "geral", sender_id: state.user.id,', 'canal do chat legado')
          replace('js/interface-runtime.js', 'script: "alert-center-v2.js?v=20260722-alert-center-v2-1",\n      styles: ["../alert-center-v2.css?v=20260722-alert-center-v2-1"]', 'script: "alert-center-v2.js?v=20260723-alert-center-v2-2",\n      styles: ["../alert-center-v2.css?v=20260723-alert-center-v2-2"]', 'cache da central de alertas')
          replace('tests/staging-e2e.spec.mjs', 'await mobilePage.click(\'#menuBtn\').catch(() => {});\n      const target = mobilePage.locator(`.nav-item[data-page="${module}"]`).first();\n      await target.click({ force: true });', 'await mobilePage.click(\'#menuBtn\').catch(() => {});\n      await mobilePage.evaluate(name => document.querySelector(`.nav-item[data-page="${name}"]`)?.click(), module);', 'navegação móvel')
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/alert-center-v2.js js/app.js js/interface-runtime.js tests/staging-e2e.spec.mjs
          git commit -m "fix: alinhar central de alertas ao esquema atual"
          git push origin HEAD:release/staging-e2e-v1
