name: OPSControl IA Next CI

on:
  pull_request:
    paths:
      - 'opscontrol-next/**'
      - '.github/workflows/opscontrol-next-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opscontrol-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Typecheck and build
        run: npm run build --silent
