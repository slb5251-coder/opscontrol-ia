name: Extract data layer

on:
  pull_request:
    branches: [homologacao]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'refactor/extract-data-layer-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-data-layer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save acorn@8
      - name: Extract data loader
        run: |
          if [ ! -f js/app-data.js ]; then
            node scripts/extract-data-layer.mjs
          else
            echo "Data layer already extracted"
          fi
      - name: Commit extracted data module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-data.js js/app.js index.html sw.js package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: extrair carregamento de dados"
          git push origin HEAD:refactor/extract-data-layer-v1
