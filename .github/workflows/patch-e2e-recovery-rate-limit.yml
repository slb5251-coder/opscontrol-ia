name: Patch E2E recovery rate limit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'homologacao'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao
          fetch-depth: 0
      - name: Accept protected recovery rate limit
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/staging-e2e.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = "const expectedRecoveryProtection = item.status === 400 && /\\/auth\\/v1\\/recover(?:\\?|$)/.test(item.url);"
          new = "const expectedRecoveryProtection = [400, 429].includes(item.status) && /\\/auth\\/v1\\/recover(?:\\?|$)/.test(item.url);"
          if old not in text:
            raise SystemExit('Validação de recuperação não localizada.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/staging-e2e.spec.mjs
          git commit -m "test: aceitar rate limit protegido na recuperação"
          git push origin HEAD:homologacao
