name: Analyze auth boundaries

on:
  pull_request:
    branches: [homologacao]

permissions:
  contents: write

jobs:
  analyze:
    if: github.head_ref == 'refactor/extract-auth-session-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-auth-session-v1
          fetch-depth: 0

      - name: Generate authentication boundary report
        run: python scripts/analyze-auth-boundaries.py

      - name: Commit analysis report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUTH_EXTRACTION_REPORT.md
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "chore: mapear autenticação e sessão"
          git push origin HEAD:refactor/extract-auth-session-v1
