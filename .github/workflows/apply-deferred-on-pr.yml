name: Apply deferred dependencies on PR

on:
  pull_request:
    branches: [homologacao]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'performance/deferred-dependencies-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/deferred-dependencies-v1
          fetch-depth: 0
      - name: Apply deferred dependency patch
        run: python scripts/apply-deferred-dependencies.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/validate-interface.yml
          git add index.html js/interface-runtime.js js/ui-polish.js sw.js package.json tests/deferred-dependencies.spec.mjs
          git commit -m "perf: adiar Leaflet e Assistente IA"
          git push origin HEAD:performance/deferred-dependencies-v1
