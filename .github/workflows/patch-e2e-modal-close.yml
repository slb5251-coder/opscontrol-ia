name: Patch E2E modal close

on:
  pull_request:
    branches: [homologacao]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'release/staging-e2e-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/staging-e2e-v1
          fetch-depth: 0
      - name: Patch modal close verification
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/staging-e2e.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''async function closeModal(page) {
            const close = page.locator('#modalClose:visible, [data-close-modal]:visible').first();
            if (await close.count()) await close.click();
            else await page.keyboard.press('Escape');
            await page.locator('#modal.hidden').waitFor({ state: 'attached', timeout: 10000 }).catch(() => {});
            await page.waitForTimeout(80);
          }
          '''
          new = '''async function closeModal(page) {
            const modal = page.locator('#modal');
            if (await modal.isHidden()) return;
            const close = page.locator('#modalClose:visible, [data-close-modal]:visible').first();
            if (await close.count()) await close.click();
            else await page.keyboard.press('Escape');
            try {
              await modal.waitFor({ state: 'hidden', timeout: 5000 });
            } catch {
              await page.keyboard.press('Escape');
              await modal.waitFor({ state: 'hidden', timeout: 5000 });
            }
            check(await modal.isHidden(), 'modal fecha pelo controle padrão');
            await page.waitForTimeout(80);
          }
          '''
          if old not in text:
            raise SystemExit('Trecho esperado não localizado')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/staging-e2e.spec.mjs
          git commit -m "test: aguardar fechamento real do modal"
          git push origin HEAD:release/staging-e2e-v1
